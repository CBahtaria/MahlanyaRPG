name: Ship Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        default: "steam"
        type: choice
        options: [steam, android, ios, all]
      branch:
        description: "Steam branch (steam only)"
        required: false
        default: "internal_qa"
      run_cert_validator:
        description: "Run cert pre-flight"
        required: false
        default: "true"
        type: boolean

jobs:
  preflight:
    name: Certification Pre-Flight
    runs-on: ubuntu-latest
    if: ${{ inputs.run_cert_validator == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Run cert pre-flight
        run: python scripts/automation/cert_validator.py --platform ${{ inputs.platform }}

  deploy-steam:
    name: Deploy to Steam
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ inputs.platform == 'steam' || inputs.platform == 'all' }}
    environment: steam-release
    steps:
      - uses: actions/checkout@v4
      - name: Install SteamCMD
        run: |
          sudo apt-get install -y lib32gcc-s1
          mkdir -p ~/steamcmd
          cd ~/steamcmd
          curl -fsSL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" \
            -o steamcmd.tar.gz
          tar -xzf steamcmd.tar.gz
      - name: Deploy to Steam (${{ inputs.branch }})
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: |
          chmod +x scripts/automation/steam_deploy.sh
          ./scripts/automation/steam_deploy.sh --branch=${{ inputs.branch }}

  deploy-android:
    name: Deploy to Google Play
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    environment: android-release
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set UNREAL_ENGINE_ROOT
        run: echo "UNREAL_ENGINE_ROOT=${{ secrets.UNREAL_ENGINE_ROOT }}" >> $GITHUB_ENV
      - name: Mobile bake (Android)
        run: python scripts/automation/mobile_bake.py --platform android
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahlanya-android-aab
          path: Build/Android/**/*.aab
          retention-days: 30
