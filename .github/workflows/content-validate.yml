name: Historical Content Validation

on:
  push:
    paths:
      - 'Content/Dialogue/**'
      - 'pipeline/history/data/**'
      - 'pipeline/history/validate_content.py'
      - '.github/workflows/content-validate.yml'
  pull_request:
    paths:
      - 'Content/Dialogue/**'
      - 'pipeline/history/data/**'
      - 'pipeline/history/validate_content.py'
      - '.github/workflows/content-validate.yml'

concurrency:
  group: content-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Swazi Historical Accuracy Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Build knowledge graph from data files
        run: |
          if [ -f pipeline/history/build_knowledge_graph.py ]; then
            python -m pipeline.history.build_knowledge_graph \
              --data-dir pipeline/history/data \
              --output-path pipeline/history/data/knowledge_graph.ndjson \
              || echo "Knowledge graph build skipped (stub not yet implemented)"
          fi

      - name: Run historical content validator
        id: validate
        run: |
          if [ -f pipeline/history/data/knowledge_graph.ndjson ]; then
            python pipeline/history/validate_content.py \
              Content/Dialogue \
              pipeline/history/data/knowledge_graph.ndjson
          else
            echo "knowledge_graph.ndjson not found — validation skipped (Plan 6 pending)"
          fi

      - name: Post violation summary to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Historical Accuracy Violation Detected\n\nThe content validator found historically inconsistent claims.\n\nRun `python pipeline/history/validate_content.py Content/Dialogue pipeline/history/data/knowledge_graph.ndjson` locally to see the exact violations.'
            })
