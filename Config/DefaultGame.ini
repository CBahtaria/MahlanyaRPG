; MahlanyaRPG — DefaultGame.ini
; Core game settings for Mahlanya Swazi historical RPG.

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/MahlanyaRPG.MahlanyaGameMode
GameDefaultMap=/Game/World/L_Eswatini_Master
TransitionMap=/Game/UI/Maps/L_Loading
ServerDefaultMap=/Game/World/L_Eswatini_Master

[/Script/Engine.Engine]
GameEngine=/Script/Engine.GameEngine
RendererSettings=/Script/Engine.RendererSettings
GameViewportClientClassName=/Script/Engine.GameViewportClient

[/Script/MahlanyaRPG.MahlanyaGameMode]
; Default era: 1820 (Sobhuza I consolidation era)
DefaultInGameYear=1820

[/Script/MahlanyaRPG.MahlanyaGameState]
WorldSeed=19061906
; 1906 — year of Eswatini colonial partition; seed chosen for historical resonance

[/Script/Engine.GameSession]
MaxPlayers=4

[SimulationBus]
; Plugin load order enforced in .uproject; listed here for documentation.
; SimulationBusPlugin (PreDefault) → All simulation plugins → EmergentNarrativePlugin
LoadOrderNote="SimulationBusPlugin must remain LoadingPhase PreDefault"

[MahlanyaHistoricalCalendar]
; Historical span of the game: 1750–1906
EarliestGameYear=1750
LatestGameYear=1906
; Game time: 1 real minute = 1 in-game day (exploration); 1 real second = 1 day (fast-forward)
RealSecondsPerGameDay=60
FastForwardSecondsPerGameDay=1

[MahlanyaWorldSettings]
; Eswatini bounding box (WGS84) for coordinate transforms
BoundingBoxWestDeg=30.79
BoundingBoxEastDeg=32.14
BoundingBoxSouthDeg=-27.32
BoundingBoxNorthDeg=-25.72
; UTM Zone 36S EPSG reference
CoordinateSystemEPSG=32736

