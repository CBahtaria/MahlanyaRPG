; MahlanyaRPG — DefaultEngine.ini
; Engine settings for Mahlanya Swazi historical RPG.
; Platform-specific overrides: Config/Android/AndroidEngine.ini, Config/IOS/IOSEngine.ini

[URL]
GameName=MahlanyaRPG

[/Script/Engine.RendererSettings]
; Nanite enabled for PC Ultra tier; disabled per platform overrides for mobile
r.Nanite.Enabled=True
; Lumen enabled for PC Ultra
r.Lumen.DiffuseIndirect.Allow=True
; Virtual Shadow Maps for Lumen compatibility
r.Shadow.Virtual.Enable=True
; Ray tracing (PC only — mobile overrides disable)
r.RayTracing=True
; HDR output
r.HDR.EnableHDROutput=0

[/Script/Engine.Engine]
+GameInstanceSubsystemClasses=/Script/MahlanyaRPG.UHardwareAdaptiveScaler

[/Script/Engine.WorldSettings]
+WorldSubsystemClasses=/Script/MahlanyaRPG.UDynamicRuntimeThrottle
+WorldSubsystemClasses=/Script/MahlanyaRPG.UYearChangeOrchestrator
+WorldSubsystemClasses=/Script/MahlanyaRPG.UMahlanyaGameClockSubsystem
+WorldSubsystemClasses=/Script/MahlanyaRPG.UProximityLODSubsystem
+WorldSubsystemClasses=/Script/MahlanyaRPG.UPerformanceAutoTuner

[/Script/Engine.GameNetworkManager]
TotalNetBandwidth=64000
MaxDynamicUpdateFrequency=60.0
MinDynamicUpdateFrequency=5.0
SimulationHeartbeatInterval=0.5

[/Script/OnlineSubsystemUtils.IpNetDriver]
MaxClientRate=128000
MaxInternetClientRate=64000

[/Script/Engine.GarbageCollectionSettings]
gc.MaxObjectsInEditor=33554432

[/Script/WorldPartitionEditor.WorldPartitionEditorSettings]
; World Partition streaming cell size — 256m for Eswatini world scale
StreamingCellSize=25600

[/Script/Engine.StreamingSettings]
; Use World Partition async streaming
s.AsyncLoadingTimeLimit=5.0
s.PriorityAsyncLoadingExtraTime=15.0

[/Script/PCGEditor.PCGEditorSettings]
; PCG Framework: graph caching enabled for settlement layout regeneration
bEnableGraphCaching=True

[CoreRedirects]
; Redirect table for future class renames during development
+ClassRedirects=(OldName="SwaziKineticLocomotionComponent",NewName="USwaziKineticLocomotion")

[/Script/Engine.PhysicsSettings]
; Chaos Physics — required for slip/recovery locomotion
PhysicsSolver=Chaos
DefaultGravityZ=-980.0
; Eswatini sea-level gravity accurate to 3 decimal places: 9.785 m/s² at 26°S
; Using standard -980 cm/s² (UE units); compensated in altitude fatigue model

[/Script/AudioMixer.AudioMixerPlatformSettings]
; MetaSounds enabled
bEnableAudioMixer=True

[/Script/Engine.AudioSettings]
; 48kHz for acoustic IR convolution accuracy
SampleRate=48000
NumChannels=32
MaxChannels=64

[/Script/GameplayAbilities.AbilitySystemGlobals]
; GAS enabled from day 1 for co-op readiness
AbilitySystemGlobalsClassName=/Script/GameplayAbilities.AbilitySystemGlobals
GlobalAttributeSetDefaultsTableName=

[ConsoleVariables]
; Default to PC Ultra settings at startup; overridden by mobile builds
r.ViewDistanceScale=8.0
r.VolumetricCloud=1
r.VolumetricFog=1
mahlanya.RuntimeErosion.Enabled=1
mahlanya.RuntimeVoronoi.Enabled=1
mahlanya.GeometricAudio.RayCount=64
mahlanya.GeometricAudio.MaxBounces=6
mahlanya.DrawDistance.Km=8.0

