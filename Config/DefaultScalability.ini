; MahlanyaRPG Scalability Configuration
; Three tiers: PC Ultra | Mobile High | Mobile Low
; See spec: docs/superpowers/specs/2026-06-24-mahlanya-rpg-design.md
;
; Feature comparison:
;   Feature              PC Ultra      Mobile High    Mobile Low
;   Terrain erosion      Runtime GPU   Pre-baked       Pre-baked
;   Nanite               Enabled       Disabled        Disabled
;   Lumen                Enabled       Disabled        Disabled
;   Volumetric clouds    Full sim      Static mesh     Skybox
;   Voronoi settlements  Runtime       Static JSON     Static JSON
;   Geometric audio      64 rays/frame Pre-baked IR    Stereo reverb bus
;   Shadow quality       Ray-traced    CSM 4 cascades  CSM 2 cascades
;   Draw distance        8km           2km             1km

[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3

; ── PC Ultra (default — maximum fidelity) ─────────────────────────────────
[Mahlanya_PCUltra_ViewDistance]
r.ViewDistanceScale=8.0

[Mahlanya_PCUltra_Shadows]
r.Shadow.CSM.MaxCascades=4
r.RayTracing.Shadows=1
r.RayTracing.AmbientOcclusion=1
r.Lumen.Reflections.Allow=1

[Mahlanya_PCUltra_NaniteAndLumen]
r.Nanite.MaxPixelsPerEdge=1.0
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.VolumetricCloud=1
r.VolumetricFog=1

[Mahlanya_PCUltra_MahlanyaSimulation]
; Enable runtime erosion compute shader (MicroclimateEngine trigger)
mahlanya.RuntimeErosion.Enabled=1
; Enable runtime Voronoi recomputation (SibayaEngine)
mahlanya.RuntimeVoronoi.Enabled=1
; Enable full 64-ray geometric audio (GeometricAudioPlugin)
mahlanya.GeometricAudio.RayCount=64
mahlanya.GeometricAudio.MaxBounces=6
; Draw distance: 8km
mahlanya.DrawDistance.Km=8.0

; ── Mobile High (pre-baked artifacts, simplified render) ──────────────────
[Mahlanya_MobileHigh_ViewDistance]
r.ViewDistanceScale=2.0

[Mahlanya_MobileHigh_Shadows]
r.Shadow.CSM.MaxCascades=4
r.RayTracing.Shadows=0
r.RayTracing.AmbientOcclusion=0
r.Lumen.Reflections.Allow=0

[Mahlanya_MobileHigh_NaniteAndLumen]
r.Nanite.MaxPixelsPerEdge=0.0
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.Reflections.Allow=0
r.VolumetricCloud=0
r.VolumetricFog=1

[Mahlanya_MobileHigh_MahlanyaSimulation]
mahlanya.RuntimeErosion.Enabled=0
mahlanya.RuntimeVoronoi.Enabled=0
mahlanya.GeometricAudio.RayCount=0
mahlanya.GeometricAudio.MaxBounces=0
mahlanya.DrawDistance.Km=2.0

; ── Mobile Low (maximum performance, static assets only) ──────────────────
[Mahlanya_MobileLow_ViewDistance]
r.ViewDistanceScale=1.0

[Mahlanya_MobileLow_Shadows]
r.Shadow.CSM.MaxCascades=2
r.RayTracing.Shadows=0
r.RayTracing.AmbientOcclusion=0
r.Lumen.Reflections.Allow=0

[Mahlanya_MobileLow_NaniteAndLumen]
r.Nanite.MaxPixelsPerEdge=0.0
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.Reflections.Allow=0
r.VolumetricCloud=0
r.VolumetricFog=0

[Mahlanya_MobileLow_MahlanyaSimulation]
mahlanya.RuntimeErosion.Enabled=0
mahlanya.RuntimeVoronoi.Enabled=0
mahlanya.GeometricAudio.RayCount=0
mahlanya.GeometricAudio.MaxBounces=0
mahlanya.DrawDistance.Km=1.0

; ── Foliage density per tier ──────────────────────────────────────────────
[Foliage@0]
; Mobile Low
FoliageDensityScale=0.30

[Foliage@1]
; Mobile High
FoliageDensityScale=0.60

[Foliage@2]
; PC Medium (if added)
FoliageDensityScale=0.80

[Foliage@3]
; PC Ultra
FoliageDensityScale=1.00

[MahlanyaSimulation@0]
mahlanya.MaxActiveNPCs=25
mahlanya.ReplicationUpdateFrequency=10.0
mahlanya.TrustMatrixUpdateRate=5.0
mahlanya.SimulationTickBudgetMs=1.2

[MahlanyaSimulation@1]
mahlanya.MaxActiveNPCs=50
mahlanya.ReplicationUpdateFrequency=20.0
mahlanya.TrustMatrixUpdateRate=10.0
mahlanya.SimulationTickBudgetMs=2.0

[MahlanyaSimulation@2]
mahlanya.MaxActiveNPCs=100
mahlanya.ReplicationUpdateFrequency=30.0
mahlanya.TrustMatrixUpdateRate=15.0
mahlanya.SimulationTickBudgetMs=3.0

[MahlanyaSimulation@3]
mahlanya.MaxActiveNPCs=200
mahlanya.ReplicationUpdateFrequency=60.0
mahlanya.TrustMatrixUpdateRate=30.0
mahlanya.SimulationTickBudgetMs=4.5
